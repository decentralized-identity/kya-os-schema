name: Deploy schemas

# Publishes the versioned schema tree to Cloudflare Pages at schema.kya-os.org.
# Requires repository secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID,
# and a Pages project named `kya-os-schema` in the DIF Cloudflare account with
# schema.kya-os.org bound as a custom domain.
on:
  push:
    branches: [main]
    paths:
      - "schemas/**"
      - "scripts/build-pages.mjs"
      - ".github/workflows/deploy-schemas.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-schemas
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      # pnpm version comes from the `packageManager` field in package.json —
      # no `version:` input, so there is a single source of truth.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Re-run the same validation gates as CI INSIDE the deploy job, before any
      # upload. A push to main runs CI and this workflow concurrently, so a
      # workflow_run/needs dependency would still race (and would be skipped on
      # workflow_dispatch); running the gates here makes the deploy itself
      # fail-closed — dist/ is never published unless the tests and the drift
      # gate pass on the exact commit being deployed.
      - name: Test
        run: pnpm test
      - name: Schema drift gate
        run: pnpm run drift
      - name: Build Pages artifact
        run: node scripts/build-pages.mjs
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # wrangler-action v4 defaults the CLI to Wrangler v4; pin to the v3 we
          # already use (matches the `wrangler` devDependency / lockfile) so this
          # bump changes only the action's Node runtime, not deploy behaviour.
          wranglerVersion: "3.114.17"
          command: pages deploy dist --project-name=kya-os-schema --branch=main
