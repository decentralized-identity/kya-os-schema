name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Test
        run: pnpm test
      - name: Schema drift gate
        run: pnpm run drift

  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reject retired protocol naming in content
        run: |
          # The matcher strings legitimately appear in the hygiene tooling and
          # in this workflow; scope the scan to project content.
          if git grep -nIiE 'mcp[-_ ]?i\b' -- \
              ':!.husky/**' ':!.github/workflows/**' ':!**/node_modules/**' \
              ; then
            echo "::error::Retired 'MCP-I' naming found in content. Use the kya-os equivalent."
            exit 1
          fi
          echo "No retired protocol naming found."
      - name: Reject assistant/tooling attribution
        run: |
          # No assistant/tooling attribution anywhere in tracked content or in
          # the commit history of this push/PR. The hygiene tooling and this
          # workflow contain the matcher strings by necessity and are excluded.
          if git grep -nIiE 'co-authored-by:[[:space:]]*(claude|anthropic)|generated with \[?claude|claude code|noreply@anthropic\.com' -- \
              ':!.husky/**' ':!.github/workflows/**' ':!**/node_modules/**' \
              ; then
            echo "::error::Assistant/tooling attribution found in tracked content."
            exit 1
          fi
          if git log --format='%an <%ae>%n%cn <%ce>%n%B' "${{ github.event.pull_request.base.sha || 'HEAD~1' }}..HEAD" \
              | grep -iE 'co-authored-by:[[:space:]]*(claude|anthropic)|noreply@anthropic\.com|generated with \[?claude'; then
            echo "::error::Assistant/tooling attribution found in commit history."
            exit 1
          fi
          echo "No assistant/tooling attribution found."
